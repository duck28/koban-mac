# Builds a universal (Apple silicon + Intel) Koban.app and publishes it as a GitHub Release.
#
# Release:  git tag v1.2.0 && git push origin v1.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Core unit tests
        run: cd KobanKit && swift test

      - name: Build universal Koban.app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ARCHS: arm64 x86_64
        run: scripts/build-app.sh

      - name: Package (.dmg and .zip)
        run: |
          mkdir -p dist dmg
          ditto -c -k --keepParent build/app/Koban.app "dist/Koban-$VERSION-macOS.zip"
          cp -R build/app/Koban.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Koban $VERSION" -srcfolder dmg -ov -format UDZO "dist/Koban-$VERSION-macOS.dmg"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Koban for Mac ${{ github.ref_name }}
          files: dist/*
          body: |
            Koban for Mac ${{ github.ref_name }} — universal app (Apple silicon + Intel), macOS 14 or later.

            Open the `.dmg` and drag Koban to Applications. The app is not notarized yet: on first launch,
            open System Settings → Privacy & Security and click "Open Anyway" for Koban.
