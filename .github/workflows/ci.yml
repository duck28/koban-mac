# Runs the core unit tests and builds Koban.app on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Core unit tests
        run: cd KobanKit && swift test
      - name: Build Koban.app
        run: scripts/build-app.sh
