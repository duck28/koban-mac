# Runs the core unit tests and builds Koban.app on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core unit tests
        run: cd KobanKit && swift test
      - name: Build Koban.app
        run: scripts/build-app.sh
